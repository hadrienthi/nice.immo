<!DOCTYPE html>

<meta property="og:title" content="Nice.immo, bientôt en ligne" />

<style>
:root{
--ecume:#F4F7F6;--nuit:#16232B;--ocean:#0E6E8C;--ocean-dark:#0A5169;
--hairline:rgba(22,35,43,0.14);
--text-secondary:rgba(22,35,43,0.72);
--serif:'Fraunces',Georgia,serif;--sans:'Public Sans',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--ocean);color:var(--ecume)}
body{font-family:var(--sans);background:var(--ecume);color:var(--nuit);min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
header{padding:28px 0 0}
.wordmark{font-family:var(--serif);font-size:30px;letter-spacing:0.01em;color:var(--nuit)}
.wm-ext{color:var(--ocean)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,10vh,90px) 0}
h1{font-family:var(--serif);font-weight:400;font-size:min(46px,7.2vw);line-height:1.24;letter-spacing:0.005em;margin-bottom:38px}
h1 span{display:block;white-space:nowrap}
h1 em{font-style:italic;color:var(--ocean)}
.btn-mail{display:inline-block;background:var(--ocean);color:var(--ecume);font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px;text-decoration:none}
.btn-mail:hover{background:var(--ocean-dark)}
</style>
</head>
<body>
<div class="wrap"><header><span class="wordmark">Nice<span class="wm-ext">.immo</span></span></header></div>
<main>
<div class="wrap">
<h1><span>Estimez</span><span><em>très prochainement</em></span><span>la valeur de votre bien</span><span>en 2 minutes.</span></h1>
<p><a class="btn-mail" href="mailto:contact@nice.immo">contact@nice.immo</a></p>
</div>
</main>
</body>
</html>
